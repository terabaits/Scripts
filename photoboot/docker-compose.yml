services:
  db:
    image: postgres:latest
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=counterdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build:
      context: .
    environment:
      - DB_HOST=db
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=counterdb
      - DB_PORT=5432
    ports:
      - "3003:3003"
    depends_on:
      - db
    volumes:
      - ./backend:/app/backend # Mount backend folder to /app/backend in container
      - ./frontend:/app/frontend # Mount frontend folder to /app/frontend in container

volumes:
  pgdata: {}  # This defines the pgdata volume
